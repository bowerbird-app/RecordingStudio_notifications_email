AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Relax metrics for test files and generators
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_notifications_email/event.rb'
    - 'lib/recording_studio_notifications_email/delivery_callbacks.rb'
    - 'lib/recording_studio_notifications_email/delivery_token.rb'
    - 'lib/recording_studio_notifications_email/action_mailer_adapter.rb'

Metrics/ModuleLength:
  Exclude:
    - 'lib/recording_studio_notifications_email/delivery_callbacks.rb'
    - 'lib/recording_studio_notifications_email/delivery_token.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_notifications_email/action_mailer_adapter.rb'
    - 'lib/recording_studio_notifications_email/delivery_callbacks.rb'
    - 'lib/recording_studio_notifications_email/delivery_token.rb'
    - 'lib/recording_studio_notifications_email/event.rb'
    - 'lib/recording_studio_notifications_email/webhook_event.rb'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'app/mailers/**/*'
    - 'lib/recording_studio_notifications_email/action_mailer_adapter.rb'
    - 'lib/recording_studio_notifications_email/delivery_callbacks.rb'
    - 'lib/recording_studio_notifications_email/event.rb'
    - 'lib/recording_studio_notifications_email/webhook_event.rb'

Metrics/ParameterLists:
  Exclude:
    - 'lib/recording_studio_notifications_email/action_mailer_adapter.rb'
    - 'lib/recording_studio_notifications_email/delivery_token.rb'
    - 'lib/recording_studio_notifications_email/webhook_event.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/recording_studio_notifications_email/action_mailer_adapter.rb'
    - 'lib/recording_studio_notifications_email/delivery_callbacks.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/recording_studio_notifications_email/action_mailer_adapter.rb'
    - 'lib/recording_studio_notifications_email/delivery_callbacks.rb'

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'

# Don't require super in service initialize methods
Lint/MissingSuper:
  Exclude:
    - 'lib/recording_studio_notifications_email/**/*'
    - 'test/services/**/*'
