name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3"]
    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
      - name: Run RuboCop
        run: bundle exec rubocop
      - name: Run gem tests
        run: bundle exec rake test
      - name: Install dummy dependencies
        working-directory: test/dummy
        run: bundle install
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
      - name: Build dummy CSS
        working-directory: test/dummy
        run: bundle exec rails tailwindcss:build
      - name: Prepare dummy database
        working-directory: test/dummy
        run: bundle exec rails db:test:prepare
        env:
          RAILS_ENV: test
      - name: Run dummy tests
        working-directory: test/dummy
        run: bundle exec rails test
        env:
          RAILS_ENV: test
      - name: Require 94% line coverage
        run: bin/check_coverage

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
      - name: Install dummy dependencies
        working-directory: test/dummy
        run: bundle install
        env:
          BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
      - name: Run Brakeman
        run: bundle exec brakeman --no-pager --quiet
      - name: Run Brakeman on the dummy app
        working-directory: test/dummy
        run: bundle exec brakeman --no-pager --quiet
      - name: Run bundler-audit
        run: bundle exec bundler-audit check --update
