name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3"]
    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      BUNDLE_GITHUB__COM: x-access-token:${{ secrets.BOWERBIRD_ORG_CI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop
      - name: Run gem tests
        run: bundle exec rake test
      - name: Install dummy dependencies
        working-directory: test/dummy
        run: bundle install
      - name: Build dummy CSS
        working-directory: test/dummy
        run: bundle exec rails tailwindcss:build
      - name: Prepare dummy database
        working-directory: test/dummy
        run: bundle exec rails db:test:prepare
        env:
          RAILS_ENV: test
      - name: Run dummy tests
        working-directory: test/dummy
        run: bundle exec rails test
        env:
          RAILS_ENV: test
      - name: Require 94% line coverage
        run: bin/check_coverage
